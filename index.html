  <script>
    (function(){
      var myMem = new Memory({
        wrapperID : "my-memory-game",
        cards : [
          {
            id : 1,
            img: "img/jesus/cute-jesus-christ-cartoon-design-vector (1).jpg"
          },
          {

          },
          {

          },
          {
            id : 4,

          },
          {
            id : 5,
            img: "img/jesus/cute-jesus-christ-cartoon-design-vector (5).jpg"
          },
          {
            id : 6,
            img: "img/jesus/cute-jesus-christ-cartoon-design-vector (6).jpg"
          },
          {
            id : 7,
            img: "img/jesus/cute-jesus-christ-cartoon-design-vector (7).jpg"
          },
          {
            id : 8,
            img: "img/jesus/cute-jesus-christ-cartoon-design-vector (8).jpg"
          },
          {
            id : 9,
            img: "img/jesus/cute-jesus-christ-cartoon-design-vector (9).jpg"
          },
          {

          },

          },

          },
          {

          },
          {

          },
          {
            id : 15,
            img: "img/jesus/cute-jesus-christ-cartoon-design-vector (15).jpg"
          },
          {
            id : 16,
            img: "img/jesus/cute-jesus-christ-cartoon-design-vector (16).jpg"
          }
        ],
        onGameStart : function() {
          console.table({'Title':'onGameStart callback!'});
          // add semantic role for game container
          var mg = document.getElementById('mg');
          if (mg) mg.setAttribute('role', 'main');

          // announce end-game messages for assistive tech
          var onend = document.getElementById('mg__onend');
          if (onend) onend.setAttribute('aria-live', 'polite');

          // make tiles keyboard-focusable and support Enter/Space to flip
          var tiles = document.querySelectorAll('.mg__tile--inner');
          for (var i = 0; i < tiles.length; i++) {
            var t = tiles[i];
            t.setAttribute('tabindex', '0');
            (function(el){
              el.addEventListener('keydown', function(e){
                var key = e.key || e.keyCode;
                if (key === 'Enter' || key === ' ' || key === 'Spacebar' || key === 13 || key === 32) {
                  e.preventDefault();
                  el.click();
                }
              });
            })(t);
          }
          return false;
        },
        onGameEnd : function() { return false; }
      });
    })();
  </script>
